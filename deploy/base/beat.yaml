apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramper-job-beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ramper-job-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ramper-job-beat
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ramper-job-registry
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-database-migrations
          image: ramper-job:local
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "wait_for_migrations", "--timeout", "900"]
          envFrom:
            - configMapRef:
                name: ramper-job-config
            - secretRef:
                name: ramper-job-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: beat
          image: ramper-job:local
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args: ["-A", "config", "beat", "-l", "INFO", "--schedule=/tmp/celerybeat-schedule"]
          envFrom:
            - configMapRef:
                name: ramper-job-config
            - secretRef:
                name: ramper-job-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command:
                - python
                - -c
                - from config.celery import app; from django.db import connection; connection.ensure_connection(); from redis import Redis; from django.conf import settings; Redis.from_url(settings.CELERY_BROKER_URL, socket_connect_timeout=2, socket_timeout=2).ping()
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - from config.celery import app; from django.db import connection; connection.ensure_connection(); from redis import Redis; from django.conf import settings; Redis.from_url(settings.CELERY_BROKER_URL, socket_connect_timeout=2, socket_timeout=2).ping()
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import pathlib, sys; sys.exit(0 if b"celery" in pathlib.Path("/proc/1/cmdline").read_bytes() and b"beat" in pathlib.Path("/proc/1/cmdline").read_bytes() else 1)
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
