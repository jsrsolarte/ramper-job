name: Validate application

on:
  workflow_call:
    inputs:
      source_sha:
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Validate application
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ramper_job
          POSTGRES_USER: ramper_job
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ramper_job -d ramper_job"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_DEBUG: "true"
      POSTGRES_DB: ramper_job
      POSTGRES_USER: ramper_job
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_CONN_MAX_AGE: "0"
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.12.1
          python-version: "3.14"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Collect static assets
        run: uv run python manage.py collectstatic --noinput

      - name: Run Django checks and tests
        run: |
          uv run python manage.py check
          uv run python manage.py test
          uv run python -m unittest scripts.test_check_staging_candidate scripts.test_check_production_promotion

      - name: Validate Kustomize overlays
        run: |
          kubectl kustomize deploy/overlays/staging >/dev/null
          kubectl kustomize deploy/overlays/prod >/dev/null

      - name: Build runtime image
        run: docker build --pull --tag ramper-job:ci .

