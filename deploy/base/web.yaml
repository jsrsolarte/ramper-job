apiVersion: v1
kind: Service
metadata:
  name: ramper-job-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ramper-job-web
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramper-job-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ramper-job-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ramper-job-web
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ramper-job-registry
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate-database
          image: ramper-job:local
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: ramper-job-config
            - secretRef:
                name: ramper-job-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: web
          image: ramper-job:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ramper-job-config
            - secretRef:
                name: ramper-job-secrets
          volumeMounts:
            - name: private-media
              mountPath: /var/lib/ramper/private-media
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["python", "-c", "import time; time.sleep(5)"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: private-media
          persistentVolumeClaim:
            claimName: ramper-job-private-media
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
