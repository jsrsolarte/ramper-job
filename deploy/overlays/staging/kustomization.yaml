apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
  - ingress.yaml
patches:
  - path: probes.patch.yaml
  - target:
      kind: ConfigMap
      name: ramper-job-config
    patch: |-
      - op: replace
        path: /data/APP_VERSION
        value: 1.3.0
  - target:
      kind: ConfigMap
      name: ramper-job-config
    patch: |-
      - op: replace
        path: /data/OMNIROUTE_BASE_URL
        value: http://omniroute.prod.svc.cluster.local:20128/v1
  - target:
      kind: Deployment
      name: ramper-job-web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ramper-job-web
      spec:
        template:
          metadata:
            annotations:
              ops.ramper.lat/config-revision: 93ec6a63
  - target:
      kind: Deployment
      name: ramper-job-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ramper-job-worker
      spec:
        template:
          metadata:
            annotations:
              ops.ramper.lat/config-revision: 93ec6a63
images:
  - name: ramper-job
    newName: ghcr.io/jsrsolarte/ramper-job
    newTag: 66562f3ea6c4cf8c982952219f3b31d406915c5a
