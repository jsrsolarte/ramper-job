apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
  - ingress.yaml
patches:
  - path: probes.patch.yaml
  - target:
      kind: ConfigMap
      name: ramper-job-config
    patch: |-
      - op: replace
        path: /data/OMNIROUTE_BASE_URL
        value: http://omniroute.prod.svc.cluster.local:20128/v1
  - target:
      kind: Deployment
      name: ramper-job-web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ramper-job-web
      spec:
        template:
          metadata:
            annotations:
              ops.ramper.lat/config-revision: c4631d5e
  - target:
      kind: Deployment
      name: ramper-job-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ramper-job-worker
      spec:
        template:
          metadata:
            annotations:
              ops.ramper.lat/config-revision: c4631d5e
images:
  - name: ramper-job
    newName: ghcr.io/jsrsolarte/ramper-job
    newTag: edfc6f4a0c1f00061bb24293b017903dd02aa0d4
