apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramper-job-web
spec:
  template:
    spec:
      containers:
        - name: web
          startupProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: jobs.ramper.lat
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: jobs.ramper.lat
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: jobs.ramper.lat
            timeoutSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramper-job-beat
spec:
  template:
    spec:
      containers:
        - name: beat
          startupProbe:
            timeoutSeconds: 20
          readinessProbe:
            timeoutSeconds: 45
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramper-job-web
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramper-job-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          livenessProbe:
            timeoutSeconds: 15
