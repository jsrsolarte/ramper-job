apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramper-job-web
spec:
  template:
    spec:
      containers:
        - name: web
          readinessProbe:
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: ramper-job-staging.ramper.lat
            timeoutSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramper-job-beat
spec:
  template:
    spec:
      containers:
        - name: beat
          startupProbe:
            timeoutSeconds: 20
          readinessProbe:
            timeoutSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramper-job-web
spec:
  strategy:
    type: Recreate
