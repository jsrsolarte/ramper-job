apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
  - ingress.yaml
patches:
  - path: probes.patch.yaml
  - target:
      kind: ConfigMap
      name: ramper-job-config
    patch: |-
      - op: replace
        path: /data/APP_VERSION
        value: 1.4.0
  - target:
      kind: ConfigMap
      name: ramper-job-config
    patch: |-
      - op: replace
        path: /data/OMNIROUTE_BASE_URL
        value: http://omniroute.prod.svc.cluster.local:20128/v1
  - target:
      kind: Deployment
      name: ramper-job-web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ramper-job-web
      spec:
        template:
          metadata:
            annotations:
              ops.ramper.lat/config-revision: 9e0c8637839c8b2c895ea60d83631821379f1104
  - target:
      kind: Deployment
      name: ramper-job-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ramper-job-worker
      spec:
        template:
          metadata:
            annotations:
              ops.ramper.lat/config-revision: 9e0c8637839c8b2c895ea60d83631821379f1104
  - target:
      kind: Deployment
      name: ramper-job-beat
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ramper-job-beat
      spec:
        template:
          metadata:
            annotations:
              ops.ramper.lat/config-revision: 9e0c8637839c8b2c895ea60d83631821379f1104
images:
  - name: ramper-job
    newName: ghcr.io/jsrsolarte/ramper-job
    newTag: 3de46979957b3f06c7cd8d44c15f8229a3f84ad3
