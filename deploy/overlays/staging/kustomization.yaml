apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
  - ingress.yaml
patches:
  - path: probes.patch.yaml
  - target:
      kind: ConfigMap
      name: ramper-job-config
    patch: |-
      - op: replace
        path: /data/OMNIROUTE_BASE_URL
        value: http://omniroute.prod.svc.cluster.local:20128/v1
images:
  - name: ramper-job
    newName: ghcr.io/jsrsolarte/ramper-job
    newTag: edfc6f4a0c1f00061bb24293b017903dd02aa0d4
