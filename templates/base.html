<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ramper Job{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css?v=14">
    <script src="/static/score-range.js?v=3" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Ramper Job, inicio">
        <span class="brand-mark" aria-hidden="true">r</span>
        <span>Ramper <strong>Job</strong></span>
      </a>
      {% if request.user.is_authenticated %}
        <nav aria-label="Navegación principal">
          <a href="{% url 'profiles:edit' %}">Mi perfil</a>
          <a href="{% url 'dashboard:analysis' %}">Análisis</a>
          {% if request.user.is_superuser %}<a href="{% url 'operations:admin_center' %}">Administración</a>{% endif %}
          <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="text-button" type="submit">Salir</button></form>
        </nav>
      {% endif %}
    </header>
    <main class="site-main">
      {% for message in messages %}<p class="notice{% if message.tags %} notice-{{ message.tags }}{% endif %}" role="status">{{ message }}</p>{% endfor %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
