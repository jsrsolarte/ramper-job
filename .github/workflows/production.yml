name: Validate and promote production

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/overlays/prod/kustomization.yaml

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      source_sha: ${{ github.sha }}
    permissions:
      contents: read

  promote:
    name: Promote the tested staging image to production
    if: github.repository == 'jsrsolarte/ramper-job'
    needs: [validate]
    runs-on: ubuntu-latest
    concurrency:
      group: ramper-job-production-deploy
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
      pull-requests: read
    steps:
      - name: Check out current main and staging history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Verify the merged staging PR and release candidate
        id: candidate
        env:
          RELEASE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main staging
          [[ "$(git rev-parse origin/main)" == "$RELEASE_SHA" ]]

          PR_HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls" | python scripts/check_production_promotion.py pr-head "$RELEASE_SHA")"
          git merge-base --is-ancestor "$PR_HEAD_SHA" "$RELEASE_SHA"

          STAGING_SHA="$(git show origin/staging:deploy/overlays/staging/kustomization.yaml | sed -nE 's/^[[:space:]]*newTag:[[:space:]]*([^[:space:]#]+).*/\1/p')"
          [[ "$STAGING_SHA" =~ ^[0-9a-f]{40}$ ]]
          python scripts/check_release_candidate.py "$STAGING_SHA" "$RELEASE_SHA" origin/staging origin/main
          echo "staging_sha=$STAGING_SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify the immutable staging image is available
        env:
          IMAGE_SHA: ${{ steps.candidate.outputs.staging_sha }}
        run: docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY,,}:$IMAGE_SHA" >/dev/null

      - name: Point production at the same tested image
        env:
          IMAGE_SHA: ${{ steps.candidate.outputs.staging_sha }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main staging
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          CURRENT_STAGING_SHA="$(git show origin/staging:deploy/overlays/staging/kustomization.yaml | sed -nE 's/^[[:space:]]*newTag:[[:space:]]*([^[:space:]#]+).*/\1/p')"
          python scripts/update_production_pin.py deploy/overlays/prod/kustomization.yaml "$IMAGE_SHA" "$RELEASE_SHA" "$CURRENT_MAIN_SHA" "$CURRENT_STAGING_SHA"

      - name: Commit and push the production image pin
        env:
          IMAGE_SHA: ${{ steps.candidate.outputs.staging_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/prod/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Production already points at ${IMAGE_SHA}"
          else
            git commit -m "deploy(prod): ${IMAGE_SHA}"
            git push origin HEAD:main
          fi
