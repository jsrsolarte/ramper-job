apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
  - ingress.yaml
patches:
  - path: probes.patch.yaml
  - target:
      kind: ConfigMap
      name: ramper-job-config
    patch: |-
      - op: replace
        path: /data/DJANGO_ALLOWED_HOSTS
        value: jobs.ramper.lat
      - op: replace
        path: /data/DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://jobs.ramper.lat
      - op: add
        path: /data/DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - op: replace
        path: /data/OMNIROUTE_BASE_URL
        value: http://omniroute.prod.svc.cluster.local:20128/v1
  - target:
      kind: Deployment
      name: ramper-job-web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ramper-job-web
      spec:
        template:
          metadata:
            annotations:
              ops.ramper.lat/config-revision: prod-v1
  - target:
      kind: Deployment
      name: ramper-job-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ramper-job-worker
      spec:
        template:
          metadata:
            annotations:
              ops.ramper.lat/config-revision: prod-v1
  - target:
      kind: Deployment
      name: ramper-job-web
    patch: |-
      - op: replace
        path: /spec/template/spec/imagePullSecrets/0/name
        value: mcp-gateway-ghcr-prod
  - target:
      kind: Deployment
      name: ramper-job-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/imagePullSecrets/0/name
        value: mcp-gateway-ghcr-prod
  - target:
      kind: Deployment
      name: ramper-job-beat
    patch: |-
      - op: replace
        path: /spec/template/spec/imagePullSecrets/0/name
        value: mcp-gateway-ghcr-prod
images:
  - name: ramper-job
    newName: ghcr.io/jsrsolarte/ramper-job
    digest: sha256:2dc016665681d633df46e3babfeb8f4634fe8cf6d5fe957ee30dc9263c6820bf
