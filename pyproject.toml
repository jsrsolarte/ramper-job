[project]
name = "ramper-job"
version = "0.1.0"
description = "Asistente familiar para búsqueda y análisis de vacantes"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3",
  "gunicorn>=23,<24",
  "celery[redis]>=5.5,<6",
  "beautifulsoup4>=4.13,<5",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "requests>=2.32,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
