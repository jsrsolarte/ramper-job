apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ramper-job
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: jobs.ramper.lat
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ramper-job-web
                port:
                  number: 8000
