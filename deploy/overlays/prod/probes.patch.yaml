apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramper-job-web
spec:
  template:
    spec:
      containers:
        - name: web
          startupProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: jobs.ramper.lat
          readinessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: jobs.ramper.lat
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              httpHeaders:
                - name: Host
                  value: jobs.ramper.lat
            timeoutSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramper-job-beat
spec:
  template:
    spec:
      containers:
        - name: beat
          startupProbe:
            timeoutSeconds: 20
          readinessProbe:
            timeoutSeconds: 45
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramper-job-web
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramper-job-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  read -r name < /proc/1/comm
                  [ "$name" = celery ] && grep -Eiq ' [0-9a-f]{8}:18eb 01 ' /proc/net/tcp /proc/net/tcp6
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  read -r name < /proc/1/comm
                  [ "$name" = celery ] && grep -Eiq ' [0-9a-f]{8}:18eb 01 ' /proc/net/tcp /proc/net/tcp6
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import socket; from config.celery import app; raise SystemExit(0 if app.control.ping(destination=['celery@' + socket.gethostname()], timeout=5) else 1)
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3
