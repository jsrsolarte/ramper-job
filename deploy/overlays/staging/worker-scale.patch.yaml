apiVersion: apps/v1
kind: Deployment
metadata:
  name: ramper-job-worker
spec:
  replicas: 3
  template:
    spec:
      initContainers:
        - name: wait-for-database-migrations
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 200m
              memory: 256Mi
      containers:
        - name: worker
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 288Mi
